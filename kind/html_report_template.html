<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent 공시 브리핑</title>
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --ink:#151a24; --muted:#667085; --line:#e4e7ee; --navy:#24477f; --navy-ink:#fff;
  --key:#fff4d6; --key-line:#f0c24b; --key-ink:#7a5200;
  --up:#c8321e; --down:#1b6fd0; --neg:#fde8e6; --neg-ink:#a32818; --why:#e8efff; --why-ink:#24477f; --sel:#eef3ff; --warn:#b26b00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1319; --card:#171c24; --ink:#e8ebf0; --muted:#98a1b0; --line:#262d38; --navy:#1d3763; --navy-ink:#fff;
    --key:#2d2510; --key-line:#8a6a1c; --key-ink:#f0c76a;
    --up:#ff7a66; --down:#6fb0ff; --neg:#341a17; --neg-ink:#ff9a8c; --why:#1b2640; --why-ink:#9db8f5; --sel:#1b2436; --warn:#e0a13c;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:18px 16px 48px}
.band{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:16px 20px}
.band h1{margin:0;font-size:19px}
.band .sub{opacity:.85;font-size:12.5px;margin-top:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:12px 24px;font-size:17px;font-weight:800;cursor:pointer;min-width:150px}
.tab b{margin-left:8px;color:var(--ink);font-size:17px}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab.on b{color:#fff}
.hint2{color:var(--muted);font-size:13px;margin:8px 2px 12px}
.q{display:inline-block;width:15px;height:15px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:10px;text-align:center;line-height:13px;margin-left:5px;cursor:help;font-weight:700;vertical-align:middle}
.tag.risk{color:var(--neg-ink);background:var(--neg);border-color:var(--neg-ink);font-weight:700}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.ctl .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl .lbl{color:var(--muted);font-size:12.5px;font-weight:700;margin-right:2px}
.fbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700;cursor:pointer}
.fbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pbar{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:8px}
.pbar i{display:block;height:100%}
.pbar .got{background:#7f93b8}
.pbar .rem{background:#f0a43c}
.pleg{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px;margin-top:4px}
.pleg b{color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}.detail{position:static!important;max-height:none!important}}
h2{font-size:13px;color:var(--muted);margin:14px 0 6px 2px;font-weight:700}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--sel)}
.row.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--navy)}
.row.plain{cursor:default}
.row .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .nm{font-weight:700}
.row .nm small{color:var(--muted);font-weight:400;margin-left:5px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11.5px;color:var(--muted);margin-left:4px;font-weight:500}
.mgmt{display:inline-block;background:#c8321e;color:#fff;border-radius:6px;padding:0 7px;font-size:11.5px;font-weight:800;margin-left:5px}
.row .mc{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .l2{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px;margin-top:1px}
.up{color:var(--up)} .down{color:var(--down)}
.bar{height:3px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy)}
.empty{padding:22px 14px;color:var(--muted);text-align:center}
.detail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;border-radius:14px}
.dh{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:16px 18px}
.dh .t{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.dh h3{margin:0;font-size:19px}
.dh h3 small{font-weight:400;opacity:.8;font-size:13px;margin-left:6px}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.dh .hl{margin-top:8px;font-size:15px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi.key{background:var(--key);border-color:var(--key-line)}
.kpi small{display:block;color:var(--muted);font-size:11.5px}
.kpi.key small{color:var(--key-ink)}
.kpi b{display:block;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.3}
.star{color:var(--key-ink);font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.card h4{margin:0 0 8px;font-size:14px;color:var(--navy)}
@media (prefers-color-scheme: dark){.card h4{color:#9db8f5}}
.pt{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.chip{flex:none;border-radius:6px;padding:0 8px;font-size:11.5px;font-weight:700;line-height:22px;min-width:44px;text-align:center}
.chip.key{background:var(--key);color:var(--key-ink);border:1px solid var(--key-line)}
.chip.why{background:var(--why);color:var(--why-ink)}
.chip.risk{background:var(--neg);color:var(--neg-ink)}
.chip.info{background:var(--bg);color:var(--muted)}
.chip.memo{background:#efe6ff;color:#5b3aa6}
.pt.key .tx{font-weight:700}
table.s{width:100%;border-collapse:collapse;font-size:13px}
table.s td{padding:5px 4px;border-top:1px solid var(--line)}
table.s tr:first-child td{border-top:0}
table.s td.d{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.s tr.key td{background:var(--key);font-weight:700}
table.s tr.past td{color:var(--muted)}
table.s tr.key.past td{color:inherit}
.est{color:var(--warn)}
.news a{color:var(--navy);text-decoration:none;border-bottom:1px solid var(--line)}
@media (prefers-color-scheme: dark){.news a{color:#9db8f5}}
.news div{padding:3px 0;font-size:13px}
.news span{color:var(--muted);font-size:12px;margin-right:6px}
.foot{color:var(--muted);font-size:12px;margin-top:12px}
.foot a{color:var(--navy)}
.hint{color:var(--muted);padding:30px 8px;text-align:center}
.legend{color:var(--muted);font-size:12px;margin:8px 2px 0}
.bb .big{font-weight:800;font-variant-numeric:tabular-nums}
.bb a{color:var(--navy);text-decoration:none}
.done{color:var(--muted);font-weight:800}
.burn{background:var(--key);color:var(--key-ink);border:1px solid var(--key-line);border-radius:6px;padding:0 6px;font-size:11.5px;font-weight:700;margin-left:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}@media (max-width:900px){.two{grid-template-columns:1fr}}

:root{--dpos:#127a4a;--dpos-bg:#e3f4eb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--dpos:#5cd29b;--dpos-bg:#14382a}}
:root[data-theme="dark"]{--dpos:#5cd29b;--dpos-bg:#14382a}

.band h1 small{font-weight:500;opacity:.8;font-size:13px;margin-left:8px}
.sent{display:inline-block;border-radius:999px;padding:0 9px;font-size:11.5px;font-weight:700;margin-left:4px;white-space:nowrap}
.sent.pos{background:var(--dpos-bg);color:var(--dpos)}.sent.neg{background:var(--neg);color:var(--neg-ink)}.sent.mix{background:var(--key);color:var(--key-ink)}.sent.unk{background:var(--line);color:var(--muted)}
.chip.pos{background:var(--dpos-bg);color:var(--dpos)}
.rank{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center;margin-right:8px;flex:none}
.row.dr .nm{display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.row.dr .ttl{color:var(--muted);font-size:12.5px;margin-top:3px}
.row.dr .brief{font-size:13.5px;margin-top:5px;line-height:1.5}
.dots{color:var(--navy);letter-spacing:1px;font-size:12px;white-space:nowrap}
.wd{color:var(--muted);font-size:12px;margin-right:6px;letter-spacing:0;font-variant-numeric:tabular-nums}
.tag.cx{background:#6d28d9;border-color:#6d28d9;color:#fff;font-weight:700}
.srcb{display:inline-block;margin-left:6px;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11px;color:var(--muted);white-space:nowrap}
.refs .rf{padding:7px 0;border-top:1px solid var(--line);font-size:13px}.refs .rf:first-of-type{border-top:0}
.refs .rd{color:var(--muted);font-size:12px;margin-right:8px;font-variant-numeric:tabular-nums}.refs .rt{color:var(--muted);margin-left:8px}.refs a{margin-left:8px;color:var(--navy)}
.refs .rf .sent{margin-left:8px}.refs .rh{color:var(--ink);margin:2px 0 0 38px}
.funnel{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline;margin:8px 2px 12px;color:var(--muted);font-size:13px}
.funnel b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}.funnel .ar{opacity:.6}
.dh .meta{margin-top:8px;font-size:12.5px;opacity:.88;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.dh .meta .dots{color:var(--navy-ink)}
.pill.sent{margin-left:0;background:rgba(255,255,255,.18);color:var(--navy-ink)}
.fin{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 26px}
.fin h5{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:700}
.vc{position:relative;height:150px;display:flex;gap:14px;align-items:stretch;padding:0 6px}
.vc .col{flex:1;position:relative;min-width:0}
.vc .b{position:absolute;left:18%;right:18%;background:var(--navy);border-radius:4px 4px 0 0}
.vc .b.n{background:var(--neg-ink);border-radius:0 0 4px 4px}
.vc .v{position:absolute;left:0;right:0;text-align:center;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.vc .v.n{color:var(--neg-ink)}
.vc .zero{position:absolute;left:0;right:0;border-top:1px solid var(--muted);opacity:.5}
.vx{display:flex;gap:14px;padding:4px 6px 0}.vx span{flex:1;text-align:center;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.kpis.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis.k2 .kpi b{white-space:normal}
.cs{width:100%;height:auto;display:block;margin-top:4px}
.cs text{font-family:inherit;fill:var(--ink)}.cs .m{fill:var(--muted);font-size:11px}.cs .vv{font-size:13px;font-weight:700}
.cs .ln{stroke:var(--navy);stroke-width:2.5;fill:none}.cs .gd{stroke:var(--line);stroke-width:1}
.chg{display:inline-flex;gap:8px;align-items:baseline;margin:0 0 2px}.chg b{font-size:20px;font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mini div{background:var(--bg);border-radius:10px;padding:8px 10px}
.mini small{display:block;color:var(--muted);font-size:11.5px}.mini b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.cmeta{color:var(--muted);font-size:12px;margin-top:6px}
.card h4 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="band">
    <h1>AI Agent 기반 공시분석 · 기준일 <span id="asof"></span></h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="hint2" id="hint2"></div>
  <div class="layout" id="main">
    <div id="left"></div>
    <div class="detail" id="detail"><div class="hint">왼쪽에서 이벤트를 선택하세요.</div></div>
  </div>
  <div class="legend" id="legend"><span class="star">★</span> = 지수 주식수에 직접 영향(변동 수량·시총 변동·반영일). 시총 변동 = 변동 주식수 × 기준일 종가(추정), 상장주식수 기준 · 우선주 제외.</div>
</div>
<script>
const DATA = __DATA__;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const CHIP = {key:"★ 중요", why:"왜", risk:"리스크", info:"참고", memo:"메모"};
const TABS = [
  ["t1","예정 CA(확정)",DATA.t1.length,"일정 확정 — 지수 반영 앵커(권리락일, 없으면 신주·변경상장일)가 오래된 순 — 신주 상장 2일 후 '반영된 CA'로 이동",null],
  ["t2","예정 CA(미확정)",DATA.t2.length+DATA.cbw.length,"일정 미확정 — 변경상장 공시 전, 변경상장 예정일(추정)이 빠른 순","소각일이 있으면 소각일 + 중앙값 약 11영업일, 없으면 취득 종료일 + 과거 간격(그 법인의 과거 3건 이상이면 그 법인 중앙값, 아니면 전체 중앙값). 변경상장 공시가 나오면 예정 CA(확정) 탭으로 이동하고 추정은 사라진다."],
  ["bb","자사주 취득",DATA.bb.length,"기준일 현재 취득 중 — 남은 취득액(추정)이 큰 순 · 체결 실적 반영","진행률 = 계획 시작일부터의 누적 체결금액 ÷ 취득 예정금액 (거래소 '자기주식매매 체결내역' 일별 공시 합산, 직접·신탁 모두). 한도는 금액이다 — 신고수량(주식수)을 넘겨도 금액이 남으면 계속 산다(삼성전자). 예상 소진일은 최근 10거래일 일평균 체결금액으로 남은 금액을 채우는 날. 체결내역이 없는 종목만 기간 경과 비례 추정."],
  ["cl","반영된 CA",DATA.closed.length,"신주·변경상장 후 2~7일 이내 종결 건 (일주일이 지나면 사라짐)",null]
];
if(DATA.dart) TABS.unshift(["dart","DART 공시분석(당일)",DATA.dart.items.length,"전일 DART 공시 중 중요도 순 심화 분석 · 목록에서 고르면 종목별 상세 리포트가 열립니다","전체 공시를 대상 종목·제목 규칙으로 거른 뒤 Jev가 중요도를 판정하고, 통과한 공시를 AI 에이전트가 본문·재무·컨센서스·뉴스로 분석한 결과입니다. 중요도 ●○ 는 같은 날 공시끼리 비교한 5단계 척도입니다."]);
if(DATA.etf) TABS.splice(3,0,["etf","ETF 흐름",DATA.etf.windows["7d"].n_etf,"대표 ETF·테마 ETF 설정/환매 — 순유입 금액(좌수 × 설정일 종가) 기준","금액 = 순증감 좌수 × 설정/환매일 종가(공시 연결이 끊긴 구간은 잔고 차분으로 보정). 국내 ETF만 집계하고 채권·머니마켓·해외 ETF는 제외했다. 1일·7일은 네이버 누적순유입과 1% 이내로 일치, 3개월은 10~30% 차이가 날 수 있다."]);

if(DATA.week) TABS.splice(DATA.dart?1:0,0,["week","주요 공시 모아보기",DATA.week.items.length,"최근 일주일 DART 심화 분석 공시 중 중요도 상위 · 같은 중요도면 최신 공시가 먼저","DART 공시분석 탭에서 심화 분석한 공시를 날짜 구분 없이 모아 중요도(●○ 5단계), 중요도 점수, 공시일 순으로 정렬합니다. 중요도는 같은 날 공시끼리 비교한 척도라 날짜가 다른 공시를 비교할 때는 참고용입니다."]);
let cur = DATA.dart ? "dart" : DATA.week ? "week" : "t1", bbFilter = "all", bbSort = "remain", t2Sort = "date";
const badge = e => e.flag ? `<span class="mgmt">${esc(e.flag)}</span>` : "";

function t2List(){   // 기본은 서버가 정한 순서(변경상장 예정일 빠른 순, 추정 없으면 맨 아래). 시총·비율 순은 절대값 큰 순
  const l = DATA.t2.slice();
  if(t2Sort==="mc") l.sort((a,b)=>Math.abs(b.mc||0)-Math.abs(a.mc||0));
  else if(t2Sort==="pct") l.sort((a,b)=>Math.abs(b.pct||0)-Math.abs(a.pct||0));
  return l;
}
function rowHtml(e){
  const mc = e.mc_txt ? `<span class="${e.mc>0?'up':'down'}">${esc(e.mc_txt)}</span>` : '<span style="color:var(--muted)">시총 -</span>';
  const sh = e.delta_txt ? `${e.delta_txt}주${e.pct!=null?` (${e.pct>0?'+':''}${e.pct}%)`:''}` : '수량 미정';
  return `<div class="row" data-id="${e.id}"><div class="l1"><div class="nm">${esc(e.issuer)}<small>${esc(e.code)}</small>${badge(e)}<span class="tag">${esc(e.type)}</span>${e.tag2?`<span class="tag risk">⚠ ${esc(e.tag2)}</span>`:''}</div><div class="mc">${mc}</div></div><div class="l2"><span>${sh}</span><span>${esc(e.right)}${e.dd?` · ${esc(e.dd)}`:''}</span></div><div class="bar"><i style="width:${e.bar}%"></i></div></div>`;
}
let etfWin = "7d";
function etfRows(list){
  if(!list.length) return '<div class="empty">해당 없음</div>';
  const mx = Math.max(1, ...list.map(i=>Math.abs(i.amt||0)));

function vchart(r, years){
  const vals = r.values.map(v=>v.v), H=150, pad=18;
  const mn = Math.min(0,...vals), mx = Math.max(0,...vals), rg = (mx-mn)||1, ph = H-2*pad;
  const base = pad + (0-mn)/rg*ph;                 // zero line, px from bottom
  const cols = r.values.map(v=>{
    const h = Math.max(2, Math.abs(v.v)/rg*ph), neg = v.v<0;
    const bar = neg ? `<div class="b n" style="bottom:${(base-h).toFixed(1)}px;height:${h.toFixed(1)}px"></div>` : `<div class="b" style="bottom:${base.toFixed(1)}px;height:${h.toFixed(1)}px"></div>`;
    const lab = neg ? `<div class="v n" style="bottom:${(base-h-16).toFixed(1)}px">${esc(v.d)}</div>` : `<div class="v" style="bottom:${(base+h+2).toFixed(1)}px">${esc(v.d)}</div>`;
    return `<div class="col">${bar}${lab}</div>`;
  }).join("");
  return `<div><h5>${esc(r.label)}</h5><div class="vc">${cols}<div class="zero" style="bottom:${base.toFixed(1)}px"></div></div><div class="vx">${years.map(y=>`<span>${esc(y)}</span>`).join("")}</div></div>`;
}
function finCard(f){
  if(!f || !f.rows || !f.rows.length) return "";
  return `<div class="card"><h4>최근 3년 실적<small>${esc(f.basis||"")}</small></h4><div class="fin">${f.rows.map(r=>vchart(r,f.years)).join("")}</div></div>`;
}
function valCard(v){
  if(!v || !v.items || !v.items.length) return "";
  return `<div class="card"><h4>가치평가 · 추정치</h4><div class="mini">${v.items.map(x=>`<div><small>${esc(x.label)}</small><b>${esc(x.value)}</b><small>${esc(x.sub||"")}</small></div>`).join("")}</div>${v.note?`<div class="cmeta">${esc(v.note)}</div>`:""}</div>`;
}
function consCard(c){
  if(!c || !c.series || !c.series.length) return "";
  const sr=c.series, vs=sr.map(x=>x.v), lo=Math.min(...vs), hi=Math.max(...vs);
  const first=vs[0], last=vs[vs.length-1], ch=first?(last/first-1)*100:0, up=ch>=0;
  const W=600,Hh=140,L=70,R=70,T=34,B=28, span=(hi-lo)||Math.abs(hi)*0.02||1;
  const y0=lo-span*0.6, y1=hi+span*0.6;                       // axis zoomed on the move, not from zero
  const X=i=>sr.length===1?W/2:L+i*(W-L-R)/(sr.length-1), Y=v=>T+(1-(v-y0)/(y1-y0))*(Hh-T-B);
  const col = up?"var(--up)":"var(--down)";
  const pts = sr.map((x,i)=>`${X(i).toFixed(1)},${Y(x.v).toFixed(1)}`).join(" ");
  const dots = sr.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="${i===sr.length-1?6:4.5}" fill="${i===sr.length-1?col:'var(--card)'}" stroke="${col}" stroke-width="2.5"/><text class="vv" x="${X(i).toFixed(1)}" y="${(Y(x.v)-12).toFixed(1)}" text-anchor="middle">${esc(x.d)}</text><text class="m" x="${X(i).toFixed(1)}" y="${Hh-8}" text-anchor="middle">${esc(x.label)}</text>`).join("");
  const grid = [0.25,0.5,0.75].map(f=>`<line class="gd" x1="${L-14}" x2="${W-R+14}" y1="${(T+f*(Hh-T-B)).toFixed(1)}" y2="${(T+f*(Hh-T-B)).toFixed(1)}"/>`).join("");
  return `<div class="card"><h4>컨센서스 추이<small>${esc(c.metric||"")} · ${esc(c.window||"")}</small></h4><div class="chg"><b class="${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(ch).toFixed(1)}%</b><span class="hint2" style="margin:0">${esc(c.window_label||"")}</span></div><svg class="cs" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="컨센서스 추이">${grid}<polyline class="ln" points="${pts}" style="stroke:${col}"/>${dots}</svg><div class="cmeta">세로축은 변화가 잘 보이도록 확대했습니다(0 기준 아님). ${esc(c.meta||"")}</div></div>`;
}
function selectDart(i, user){
  dsel = i; const d = ditems[i], j = d.j;
  document.querySelectorAll("#left .row.dr").forEach(r=>r.classList.toggle("sel", +r.dataset.d===i));
  const kp = (j.kpis||[]).map(k=>`<div class="kpi"><small>${esc(k.label)}</small><b>${esc(k.value)}</b><small>${esc(k.sub||"")}</small></div>`).join("");
  const pts = [`<div class="pt"><span class="chip why">투심</span><span class="tx">${esc(j.sentiment.label)} · ${esc(j.sentiment.reason||"")}</span></div>`]
    .concat(j.points.map(p=>{const m=PT[p.type]||PT.unk; return `<div class="pt"><span class="chip ${m[0]}">${m[1]}</span><span class="tx">${esc(p.text)}${p.src?`<span class="srcb">${esc(p.src)}</span>`:""}</span></div>`;}))
    .concat([`<div class="pt"><span class="chip info">중요도</span><span class="tx"><span class="dots">${dots(d.imp)}</span> ${esc(j.importance_reason||"")}</span></div>`]).join("");
  const SC = {"긍정적":["pos","▲ 긍정적"],"부정적":["neg","▼ 부정적"],"혼재됨":["mix","◆ 혼재됨"]};
  const refs = j.composite ? `<div class="card refs"><h4>참고 공시<small>같은 날 함께 묶인 ${j.composite.refs.length}건 · 대표 공시는 ${esc(j.corp_name)} ${esc(j.disclosure_title.replace(/ 외 \d+건$/,""))}</small></h4>${j.composite.refs.map(r=>{const c=SC[(r.sentiment||{}).label]||["unk","? 알수 없음"];return `<div class="rf"><span class="rd">${esc(r.disclosure_date.slice(5))}</span><b>${esc(r.corp_name)}</b><span class="rt">${esc(r.disclosure_title)}</span><span class="sent ${c[0]}">${c[1]}</span><a href="${esc(r.dart_url)}" target="_blank" rel="noopener">DART ↗</a><div class="rh">${esc(r.headline)}</div></div>`;}).join("")}</div>` : "";
  const news = (j.news||[]).length ? `<div class="card news"><h4>뉴스 근거</h4>${j.news.map(n=>`<div><span>${esc(n.outlet)} · ${esc(n.date)}</span><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></div>`).join("")}</div>` : "";
  $("#detail").innerHTML = `<div class="dh"><div class="t"><h3>${coName(j)}</h3><span class="pill">${esc(j.tag)}${j.composite?" · 복합공시":""} · ${esc(j.sentiment.label)}</span></div><div class="hl">${esc(j.headline)}</div><div class="meta"><span>${esc(j.disclosure_title)}</span><span>${esc(j.disclosure_date)} 공시</span></div></div><div class="kpis k2">${kp}</div><div class="card"><h4>핵심 포인트</h4>${pts}</div>${finCard(j.financials)}${valCard(j.valuation)}${consCard(j.consensus)}${news}${refs}<div class="foot">${j.dart_url?`<a href="${esc(j.dart_url)}" target="_blank" rel="noopener">DART 원문 ↗</a> · `:''}${esc(j.sources_note||"")} 정보 제공용이며 투자 권유가 아닙니다.</div>`;
  if(user && window.innerWidth<=900) $("#detail").scrollIntoView({behavior:"smooth",block:"start"});
}
function init(){
  $("#asof").textContent = DATA.asof;
  $("#sub").textContent = `시총 기준가: ${DATA.price_date||'-'} 종가${DATA.n_small?` · 시총 변동 ${Math.round(DATA.min_mc/1e8)}억원 미만 ${DATA.n_small}건 생략`:''} · 생성 ${DATA.generated}`;
  $("#tabs").innerHTML = TABS.map(t=>`<button class="tab" data-t="${t[0]}">${t[1]}<b>${t[2]}</b></button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.t; renderTab();});
  renderTab();
}
init();
