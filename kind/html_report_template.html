<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIND 인덱스 리포트</title>
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --ink:#151a24; --muted:#667085; --line:#e4e7ee; --navy:#24477f; --navy-ink:#fff;
  --key:#fff4d6; --key-line:#f0c24b; --key-ink:#7a5200;
  --up:#c8321e; --down:#1b6fd0; --pos:#e3f4ea; --pos-ink:#1b6b3d; --neg:#fde8e6; --neg-ink:#a32818; --why:#e8efff; --why-ink:#24477f;
  --sel:#eef3ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1319; --card:#171c24; --ink:#e8ebf0; --muted:#98a1b0; --line:#262d38; --navy:#1d3763; --navy-ink:#fff;
    --key:#2d2510; --key-line:#8a6a1c; --key-ink:#f0c76a;
    --up:#ff7a66; --down:#6fb0ff; --pos:#16301f; --pos-ink:#6fd49a; --neg:#341a17; --neg-ink:#ff9a8c; --why:#1b2640; --why-ink:#9db8f5; --sel:#1b2436;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:18px 16px 48px}
.band{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:16px 20px}
.band h1{margin:0;font-size:19px}
.band .sub{opacity:.85;font-size:12.5px;margin-top:2px}
.layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px;align-items:start;margin-top:14px}
@media (max-width:900px){.layout{grid-template-columns:1fr}.detail{position:static!important;max-height:none!important}}
h2{font-size:13px;color:var(--muted);margin:0 0 6px 2px;font-weight:700}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.row:first-child{border-top:0}
.row:hover{background:var(--sel)}
.row.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--navy)}
.row .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .nm{font-weight:700}
.row .nm small{color:var(--muted);font-weight:400;margin-left:5px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11.5px;color:var(--muted);margin-left:4px;font-weight:500}
.row .mc{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .l2{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px;margin-top:1px}
.up{color:var(--up)} .down{color:var(--down)}
.bar{height:3px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy)}
.sec{margin-top:16px}
.row.cb{cursor:pointer;padding:8px 14px}
.row.cb .l2{margin-top:0}
.detail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;border-radius:14px}
.dh{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:16px 18px}
.dh .t{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.dh h3{margin:0;font-size:19px}
.dh h3 small{font-weight:400;opacity:.8;font-size:13px;margin-left:6px}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.dh .hl{margin-top:8px;font-size:15px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi.key{background:var(--key);border-color:var(--key-line)}
.kpi small{display:block;color:var(--muted);font-size:11.5px}
.kpi.key small{color:var(--key-ink)}
.kpi b{display:block;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.3}
.star{color:var(--key-ink);font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.card h4{margin:0 0 8px;font-size:14px;color:var(--navy)}
@media (prefers-color-scheme: dark){.card h4{color:#9db8f5}}
.pt{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.chip{flex:none;border-radius:6px;padding:0 8px;font-size:11.5px;font-weight:700;line-height:22px;min-width:44px;text-align:center}
.chip.key{background:var(--key);color:var(--key-ink);border:1px solid var(--key-line)}
.chip.why{background:var(--why);color:var(--why-ink)}
.chip.risk{background:var(--neg);color:var(--neg-ink)}
.chip.info{background:var(--bg);color:var(--muted)}
.pt.key .tx{font-weight:700}
table.s{width:100%;border-collapse:collapse;font-size:13px}
table.s td{padding:5px 4px;border-top:1px solid var(--line)}
table.s tr:first-child td{border-top:0}
table.s td.d{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.s tr.key td{background:var(--key);font-weight:700}
.est{color:#b26b00}
.news a{color:var(--navy);text-decoration:none;border-bottom:1px solid var(--line)}
@media (prefers-color-scheme: dark){.news a{color:#9db8f5}}
.news div{padding:3px 0;font-size:13px}
.news span{color:var(--muted);font-size:12px;margin-right:6px}
.foot{color:var(--muted);font-size:12px;margin-top:12px}
.foot a{color:var(--navy)}
.hint{color:var(--muted);padding:30px 8px;text-align:center}
.legend{color:var(--muted);font-size:12px;margin:8px 2px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="band">
    <h1>KIND 인덱스 리포트 · 기준일 <span id="asof"></span></h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="layout">
    <div>
      <h2>다가오는 이벤트 — 시총 변동 순</h2>
      <div class="list" id="list"></div>
      <div id="cbw"></div>
      <div id="done"></div>
      <div class="legend"><span class="star">★</span> = 지수 주식수에 직접 영향(변동 수량·시총 변동·반영일). 시총 변동 = 변동 주식수 × 기준일 종가(추정), 상장주식수 기준.</div>
    </div>
    <div class="detail" id="detail"><div class="hint">왼쪽에서 이벤트를 선택하세요.</div></div>
  </div>
</div>
<script>
const DATA = __DATA__;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const CHIP = {key:"★ 중요", why:"왜", risk:"리스크", info:"참고"};

function render(){
  $("#asof").textContent = DATA.asof;
  const n = DATA.events.length, wait = DATA.events.filter(e=>e.applied).length;
  $("#sub").textContent = `진행 중 ${n}건 · 이 중 지수 반영 완료·신주 상장 대기 ${wait}건 · 시총 기준가: ${DATA.price_date||'-'} 종가`;
  $("#list").innerHTML = DATA.events.map(e=>{
    const mc = e.mc_txt ? `<span class="${e.mc>0?'up':'down'}">${esc(e.mc_txt)}</span>` : '<span style="color:var(--muted)">시총 -</span>';
    const sh = e.delta_txt ? `${e.delta_txt}주${e.pct!=null?` (${e.pct>0?'+':''}${e.pct}%)`:''}` : '수량 미정';
    const when = e.date ? (e.applied ? `${e.date} 반영 완료` : `반영 ${e.date}${e.est?' (추정)':''} · ${e.dday}`) : '반영일 미정';
    return `<div class="row" data-id="${e.id}"><div class="l1"><div class="nm">${esc(e.issuer)}<small>${esc(e.code)}</small><span class="tag">${esc(e.type)}</span></div><div class="mc">${mc}</div></div><div class="l2"><span>${sh}</span><span>${esc(when)}</span></div><div class="bar"><i style="width:${e.bar}%"></i></div></div>`;
  }).join("") || '<div class="hint">진행 중인 이벤트가 없습니다.</div>';
  if(DATA.cbw.length){
    $("#cbw").innerHTML = `<div class="sec"><h2>장기 대기 — CB/BW 잔여 전환 (감만)</h2><div class="list">${DATA.cbw.map(e=>`<div class="row cb" data-id="${e.id}"><div class="l1"><div class="nm">${esc(e.issuer)}<small>${esc(e.code)}</small><span class="tag">${esc(e.type)}</span></div><div class="mc" style="font-weight:600">${esc(e.line)}</div></div><div class="l2"><span></span><span>${esc(e.nextkey)}</span></div></div>`).join("")}</div></div>`;
  }
  if(DATA.done.length){
    $("#done").innerHTML = `<div class="sec"><h2>최근 종결 (7일 이내)</h2><div class="list">${DATA.done.map(e=>`<div class="row cb"><div class="l1"><div class="nm">${esc(e.issuer)}<small>${esc(e.code)}</small><span class="tag">${esc(e.type)}</span></div><div class="mc" style="font-weight:600">종결 ${esc(e.date)}</div></div></div>`).join("")}</div></div>`;
  }
  document.querySelectorAll(".row[data-id]").forEach(r => r.onclick = () => select(+r.dataset.id, true));
}

function select(id, user){
  const e = DATA.events.find(x=>x.id===id) || DATA.cbw.find(x=>x.id===id); if(!e) return;
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("sel", +r.dataset.id===id));
  let kpi = "";
  if(e.delta_txt!=null || e.date){
    kpi += `<div class="kpi key"><small><span class="star">★</span> 지수 주식수 변동(주)</small><b class="${e.delta>0?'up':'down'}">${e.delta_txt!=null?e.delta_txt:'미정'}</b><small>${e.pct!=null?`상장주식수 대비 ${e.pct>0?'+':''}${e.pct}%`:''}</small></div>`;
    kpi += `<div class="kpi key"><small><span class="star">★</span> 시총 변동(추정)</small><b class="${e.mc>0?'up':'down'}">${esc(e.mc_txt||'-')}</b><small>${e.price?`종가 ${e.price.toLocaleString('ko-KR')}원 기준`:''}</small></div>`;
    kpi += `<div class="kpi key"><small><span class="star">★</span> 지수 반영일</small><b>${esc(e.date||'미정')}</b><small>${e.date?(e.applied?'반영 완료':esc((e.dday||'')+(e.est?' · 추정':' · 확정'))):'소각 공시 후 확정'}</small></div>`;
  }
  if(e.kpi4) kpi += `<div class="kpi"><small>${esc(e.kpi4.label)}</small><b>${esc(e.kpi4.value)}</b><small>${esc(e.kpi4.sub||'')}</small></div>`;
  const pts = e.points.map(([k,t])=>`<div class="pt ${k}"><span class="chip ${k}">${CHIP[k]}</span><span class="tx">${esc(t)}</span></div>`).join("");
  const sched = e.sched && e.sched.length ? `<div class="card"><h4>일정</h4><table class="s">${e.sched.map(s=>`<tr class="${s.key?'key':''}"><td>${s.key?'<span class="star">★</span> ':''}${esc(s.label)}</td><td class="d">${esc(s.date)}</td><td class="d" style="color:var(--muted)">${s.past?'완료':esc(s.dday)}${s.est&&!s.past?' <span class="est">추정</span>':''}</td></tr>`).join("")}</table></div>` : "";
  const news = e.news && e.news.length ? `<div class="card news"><h4>뉴스 근거</h4>${e.news.map(n=>`<div><span>${esc(n.outlet)} · ${esc(n.date)}</span><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></div>`).join("")}</div>` : "";
  $("#detail").innerHTML = `<div class="dh"><div class="t"><h3>${esc(e.issuer)}<small>${esc(e.code)}</small></h3><span class="pill">${esc(e.type)}</span></div><div class="hl">${esc(e.headline)}</div></div><div class="kpis">${kpi}</div><div class="card"><h4>핵심 포인트</h4>${pts}</div>${sched}${news}<div class="foot">${e.link?`<a href="${esc(e.link.url)}" target="_blank" rel="noopener">${esc(e.link.label)}</a>`:''} · 정보 제공용이며 투자 권유가 아닙니다.</div>`;
  history.replaceState(null,"","#e"+id);
  if(user && window.innerWidth<=900) $("#detail").scrollIntoView({behavior:"smooth",block:"start"});
}
render();
const h = location.hash.match(/#e(\d+)/);
if(h) select(+h[1]); else if(DATA.events.length) select(DATA.events[0].id);
</script>
</body>
</html>
