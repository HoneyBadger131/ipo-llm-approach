const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const CHIP = {key:"★ 중요", why:"왜", risk:"리스크", info:"참고"};

function render(){
  $("#asof").textContent = DATA.asof;
  const n = DATA.events.length, wait = DATA.events.filter(e=>e.applied).length;
  $("#sub").textContent = `진행 중 ${n}건${DATA.n_small?` (시총 변동 ${Math.round(DATA.min_mc/1e8)}억원 미만 ${DATA.n_small}건 생략)`:''} · 이 중 지수 반영 완료·신주 상장 대기 ${wait}건 · 시총 기준가: ${DATA.price_date||'-'} 종가`;
  $("#list").innerHTML = DATA.events.map(e=>{
    const mc = e.mc_txt ? `<span class="${e.mc>0?'up':'down'}">${esc(e.mc_txt)}</span>` : '<span style="color:var(--muted)">시총 -</span>';
    const sh = e.delta_txt ? `${e.delta_txt}주${e.pct!=null?` (${e.pct>0?'+':''}${e.pct}%)`:''}` : '수량 미정';
    const when = e.date ? (e.applied ? `${e.date} 반영 완료` : `반영 ${e.date}${e.est?' (추정)':''} · ${e.dday}`) : '반영일 미정';
    return `<div class="row" data-id="${e.id}"><div class="l1"><div class="nm">${esc(e.issuer)}<small>${esc(e.code)}</small><span class="tag">${esc(e.type)}</span></div><div class="mc">${mc}</div></div><div class="l2"><span>${sh}</span><span>${esc(when)}</span></div><div class="bar"><i style="width:${e.bar}%"></i></div></div>`;
  }).join("") || '<div class="hint">진행 중인 이벤트가 없습니다.</div>';
  if(DATA.cbw.length){
    $("#cbw").innerHTML = `<div class="sec"><h2>장기 대기 — CB/BW 잔여 전환 (감만${DATA.n_cbw_more?` · 그 외 ${DATA.n_cbw_more}건 생략`:''})</h2><div class="list">${DATA.cbw.map(e=>`<div class="row cb" data-id="${e.id}"><div class="l1"><div class="nm">${esc(e.issuer)}<small>${esc(e.code)}</small><span class="tag">${esc(e.type)}</span></div><div class="mc" style="font-weight:600">${esc(e.line)}</div></div><div class="l2"><span></span><span>${esc(e.nextkey)}</span></div></div>`).join("")}</div></div>`;
  }
  if(DATA.done.length){
    $("#done").innerHTML = `<div class="sec"><h2>최근 종결 (7일 이내)</h2><div class="list">${DATA.done.map(e=>`<div class="row cb"><div class="l1"><div class="nm">${esc(e.issuer)}<small>${esc(e.code)}</small><span class="tag">${esc(e.type)}</span></div><div class="mc" style="font-weight:600">종결 ${esc(e.date)}</div></div></div>`).join("")}</div></div>`;
  }
  document.querySelectorAll(".row[data-id]").forEach(r => r.onclick = () => select(+r.dataset.id, true));
}

function select(id, user){
  const e = DATA.events.find(x=>x.id===id) || DATA.cbw.find(x=>x.id===id); if(!e) return;
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("sel", +r.dataset.id===id));
  let kpi = "";
  if(e.delta_txt!=null || e.date){
    kpi += `<div class="kpi key"><small><span class="star">★</span> 지수 주식수 변동(주)</small><b class="${e.delta>0?'up':'down'}">${e.delta_txt!=null?e.delta_txt:'미정'}</b><small>${e.pct!=null?`상장주식수 대비 ${e.pct>0?'+':''}${e.pct}%`:''}</small></div>`;
    kpi += `<div class="kpi key"><small><span class="star">★</span> 시총 변동(추정)</small><b class="${e.mc>0?'up':'down'}">${esc(e.mc_txt||'-')}</b><small>${e.price?`종가 ${e.price.toLocaleString('ko-KR')}원 기준`:''}</small></div>`;
    kpi += `<div class="kpi key"><small><span class="star">★</span> 지수 반영일</small><b>${esc(e.date||'미정')}</b><small>${e.date?(e.applied?'반영 완료':esc((e.dday||'')+(e.est?' · 추정':' · 확정'))):'소각 공시 후 확정'}</small></div>`;
  }
  if(e.kpi4) kpi += `<div class="kpi"><small>${esc(e.kpi4.label)}</small><b>${esc(e.kpi4.value)}</b><small>${esc(e.kpi4.sub||'')}</small></div>`;
  const pts = e.points.map(([k,t])=>`<div class="pt ${k}"><span class="chip ${k}">${CHIP[k]}</span><span class="tx">${esc(t)}</span></div>`).join("");
  const sched = e.sched && e.sched.length ? `<div class="card"><h4>일정</h4><table class="s">${e.sched.map(s=>`<tr class="${s.key?'key':''}${s.past?' past':''}"><td>${s.key?'<span class="star">★</span> ':''}${esc(s.label)}</td><td class="d">${esc(s.date)}</td><td class="d" style="color:var(--muted)">${s.past?'완료':esc(s.dday)}${s.est&&!s.past?' <span class="est">추정</span>':''}</td></tr>`).join("")}</table></div>` : "";
  const news = e.news && e.news.length ? `<div class="card news"><h4>뉴스 근거</h4>${e.news.map(n=>`<div><span>${esc(n.outlet)} · ${esc(n.date)}</span><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></div>`).join("")}</div>` : "";
  $("#detail").innerHTML = `<div class="dh"><div class="t"><h3>${esc(e.issuer)}<small>${esc(e.code)}</small></h3><span class="pill">${esc(e.type)}</span></div><div class="hl">${esc(e.headline)}</div></div><div class="kpis">${kpi}</div><div class="card"><h4>핵심 포인트</h4>${pts}</div>${sched}${news}<div class="foot">${e.link?`<a href="${esc(e.link.url)}" target="_blank" rel="noopener">${esc(e.link.label)}</a>`:''} · 정보 제공용이며 투자 권유가 아닙니다.</div>`;
  history.replaceState(null,"","#e"+id);
  if(user && window.innerWidth<=900) $("#detail").scrollIntoView({behavior:"smooth",block:"start"});
}
render();
const h = location.hash.match(/#e(\d+)/);
if(h) select(+h[1]); else if(DATA.events.length) select(DATA.events[0].id);
</script>
