  $("#left").innerHTML = html;
  document.querySelectorAll("#left .fbtn").forEach(b => b.onclick = () => { if(b.dataset.set==="f") bbFilter=b.dataset.v; else if(b.dataset.set==="t2") t2Sort=b.dataset.v; else bbSort=b.dataset.v; renderTab(); });
  document.querySelectorAll("#left .row[data-id]").forEach(r => r.onclick = () => select(+r.dataset.id, true));
  if(two){
    const list = cur==="t1"?DATA.t1:t2List();
    if(list.length) select(list[0].id); else $("#detail").innerHTML = '<div class="hint">이벤트가 없습니다.</div>';
  }
}
function select(id, user){
  const e = DATA.t1.find(x=>x.id===id) || DATA.t2.find(x=>x.id===id) || DATA.cbw.find(x=>x.id===id); if(!e) return;
  document.querySelectorAll("#left .row").forEach(r=>r.classList.toggle("sel", +r.dataset.id===id));
  let kpi = "";
  if(e.delta_txt!=null || e.date){
    kpi += `<div class="kpi key"><small><span class="star">★</span> 지수 주식수 변동(주)</small><b class="${e.delta>0?'up':'down'}">${e.delta_txt!=null?e.delta_txt:'미정'}</b><small>${e.pct!=null?`상장주식수 대비 ${e.pct>0?'+':''}${e.pct}%`:''}</small></div>`;
    kpi += `<div class="kpi key"><small><span class="star">★</span> 시총 변동(추정)</small><b class="${e.mc>0?'up':'down'}">${esc(e.mc_txt||'-')}</b><small>${e.price?`종가 ${e.price.toLocaleString('ko-KR')}원 기준`:''}</small></div>`;
    kpi += `<div class="kpi key"><small><span class="star">★</span> 지수 반영일</small><b>${esc(e.date||'미정')}</b><small>${e.date?(e.applied?'반영 완료':esc((e.dday||'')+(e.est?' · 추정':' · 확정'))):'변경상장 공시 후 확정'}</small></div>`;
  }
  if(e.kpi4) kpi += `<div class="kpi"><small>${esc(e.kpi4.label)}</small><b>${esc(e.kpi4.value)}</b><small>${esc(e.kpi4.sub||'')}</small></div>`;
  const pts = (e.memo?[["memo",e.memo]]:[]).concat(e.points).map(([k,t,tip])=>`<div class="pt ${k}"><span class="chip ${k}">${CHIP[k]}</span><span class="tx">${esc(t)}${tip?`<span class="q" title="${esc(tip)}">?</span>`:''}</span></div>`).join("");
  const sched = e.sched && e.sched.length ? `<div class="card"><h4>일정</h4><table class="s">${e.sched.map(s=>`<tr class="${s.key?'key':''}${s.past?' past':''}"><td>${s.key?'<span class="star">★</span> ':''}${esc(s.label)}</td><td class="d">${esc(s.date)}</td><td class="d" style="color:var(--muted)">${s.past?'완료':esc(s.dday)}${s.est&&!s.past?' <span class="est">추정</span>':''}</td></tr>`).join("")}</table></div>` : "";
  const news = e.news && e.news.length ? `<div class="card news"><h4>뉴스 근거</h4>${e.news.map(n=>`<div><span>${esc(n.outlet)} · ${esc(n.date)}</span><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></div>`).join("")}</div>` : "";
  $("#detail").innerHTML = `<div class="dh"><div class="t"><h3>${esc(e.issuer)}<small>${esc(e.code)}</small>${badge(e)}</h3><span class="pill">${esc(e.type)}${e.tag2?` · ⚠ ${esc(e.tag2)}`:''}</span></div><div class="hl">${esc(e.headline)}</div></div><div class="kpis">${kpi}</div><div class="card"><h4>핵심 포인트</h4>${pts}</div>${sched}${news}<div class="foot">${e.link?`<a href="${esc(e.link.url)}" target="_blank" rel="noopener">${esc(e.link.label)}</a>`:''} · 정보 제공용이며 투자 권유가 아닙니다.</div>`;
  if(user && window.innerWidth<=900) $("#detail").scrollIntoView({behavior:"smooth",block:"start"});
}

const dots = n => "●".repeat(n)+"○".repeat(5-n);
let dsel = 0;
const PT = {pos:["pos","긍정"], neg:["risk","리스크"], mix:["key","혼재"], unk:["info","미확인"]};
function dartList(){
  return `<div class="list">${DATA.dart.items.map((d,i)=>`<div class="row dr" data-d="${i}"><div class="l1"><div class="nm"><span class="rank">${d.rank}</span>${esc(d.j.corp_name)}<small>${esc(d.j.stock_code)}</small><span class="tag">${esc(d.j.tag)}</span><span class="sent ${d.sent}">${esc(d.sent_l)}</span></div><div class="dots" title="중요도 ${d.imp}/5">${dots(d.imp)}</div></div><div class="ttl">${esc(d.j.disclosure_title)}</div><div class="brief">${esc(d.brief)}</div></div>`).join("")}</div>`;
}
function vchart(r, years){
  const vals = r.values.map(v=>v.v), H=150, pad=18;
  const mn = Math.min(0,...vals), mx = Math.max(0,...vals), rg = (mx-mn)||1, ph = H-2*pad;
  const base = pad + (0-mn)/rg*ph;                 // zero line, px from bottom
  const cols = r.values.map(v=>{
    const h = Math.max(2, Math.abs(v.v)/rg*ph), neg = v.v<0;
    const bar = neg ? `<div class="b n" style="bottom:${(base-h).toFixed(1)}px;height:${h.toFixed(1)}px"></div>` : `<div class="b" style="bottom:${base.toFixed(1)}px;height:${h.toFixed(1)}px"></div>`;
    const lab = neg ? `<div class="v n" style="bottom:${(base-h-16).toFixed(1)}px">${esc(v.d)}</div>` : `<div class="v" style="bottom:${(base+h+2).toFixed(1)}px">${esc(v.d)}</div>`;
    return `<div class="col">${bar}${lab}</div>`;
  }).join("");
  return `<div><h5>${esc(r.label)}</h5><div class="vc">${cols}<div class="zero" style="bottom:${base.toFixed(1)}px"></div></div><div class="vx">${years.map(y=>`<span>${esc(y)}</span>`).join("")}</div></div>`;
}
function finCard(f){
  if(!f || !f.rows || !f.rows.length) return "";
  return `<div class="card"><h4>최근 3년 실적<small>${esc(f.basis||"")}</small></h4><div class="fin">${f.rows.map(r=>vchart(r,f.years)).join("")}</div></div>`;
}
function valCard(v){
  if(!v || !v.items || !v.items.length) return "";
  return `<div class="card"><h4>가치평가 · 추정치</h4><div class="mini">${v.items.map(x=>`<div><small>${esc(x.label)}</small><b>${esc(x.value)}</b><small>${esc(x.sub||"")}</small></div>`).join("")}</div>${v.note?`<div class="cmeta">${esc(v.note)}</div>`:""}</div>`;
}
function consCard(c){
  if(!c || !c.series || !c.series.length) return "";
  const sr=c.series, vs=sr.map(x=>x.v), lo=Math.min(...vs), hi=Math.max(...vs);
  const first=vs[0], last=vs[vs.length-1], ch=first?(last/first-1)*100:0, up=ch>=0;
  const W=600,Hh=140,L=70,R=70,T=34,B=28, span=(hi-lo)||Math.abs(hi)*0.02||1;
  const y0=lo-span*0.6, y1=hi+span*0.6;                       // axis zoomed on the move, not from zero
  const X=i=>sr.length===1?W/2:L+i*(W-L-R)/(sr.length-1), Y=v=>T+(1-(v-y0)/(y1-y0))*(Hh-T-B);
  const col = up?"var(--up)":"var(--down)";
  const pts = sr.map((x,i)=>`${X(i).toFixed(1)},${Y(x.v).toFixed(1)}`).join(" ");
  const dots = sr.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="${i===sr.length-1?6:4.5}" fill="${i===sr.length-1?col:'var(--card)'}" stroke="${col}" stroke-width="2.5"/><text class="vv" x="${X(i).toFixed(1)}" y="${(Y(x.v)-12).toFixed(1)}" text-anchor="middle">${esc(x.d)}</text><text class="m" x="${X(i).toFixed(1)}" y="${Hh-8}" text-anchor="middle">${esc(x.label)}</text>`).join("");
  const grid = [0.25,0.5,0.75].map(f=>`<line class="gd" x1="${L-14}" x2="${W-R+14}" y1="${(T+f*(Hh-T-B)).toFixed(1)}" y2="${(T+f*(Hh-T-B)).toFixed(1)}"/>`).join("");
  return `<div class="card"><h4>컨센서스 추이<small>${esc(c.metric||"")} · ${esc(c.window||"")}</small></h4><div class="chg"><b class="${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(ch).toFixed(1)}%</b><span class="hint2" style="margin:0">${esc(c.window_label||"")}</span></div><svg class="cs" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="컨센서스 추이">${grid}<polyline class="ln" points="${pts}" style="stroke:${col}"/>${dots}</svg><div class="cmeta">세로축은 변화가 잘 보이도록 확대했습니다(0 기준 아님). ${esc(c.meta||"")}</div></div>`;
}
function selectDart(i, user){
  dsel = i; const d = DATA.dart.items[i], j = d.j;
  document.querySelectorAll("#left .row.dr").forEach(r=>r.classList.toggle("sel", +r.dataset.d===i));
  const kp = (j.kpis||[]).map(k=>`<div class="kpi"><small>${esc(k.label)}</small><b>${esc(k.value)}</b><small>${esc(k.sub||"")}</small></div>`).join("");
  const pts = [`<div class="pt"><span class="chip why">투심</span><span class="tx">${esc(j.sentiment.label)} · ${esc(j.sentiment.reason||"")}</span></div>`]
    .concat(j.points.map(p=>{const m=PT[p.type]||PT.unk; return `<div class="pt"><span class="chip ${m[0]}">${m[1]}</span><span class="tx">${esc(p.text)}</span></div>`;}))
    .concat([`<div class="pt"><span class="chip info">중요도</span><span class="tx"><span class="dots">${dots(d.imp)}</span> ${esc(j.importance_reason||"")}</span></div>`]).join("");
  const news = (j.news||[]).length ? `<div class="card news"><h4>뉴스 근거</h4>${j.news.map(n=>`<div><span>${esc(n.outlet)} · ${esc(n.date)}</span><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></div>`).join("")}</div>` : "";
  $("#detail").innerHTML = `<div class="dh"><div class="t"><h3>${esc(j.corp_name)}<small>${esc(j.stock_code)}</small></h3><span class="pill">${esc(j.tag)} · ${esc(j.sentiment.label)}</span></div><div class="hl">${esc(j.headline)}</div><div class="meta"><span>${esc(j.disclosure_title)}</span><span>${esc(j.disclosure_date)} 공시</span></div></div><div class="kpis k2">${kp}</div><div class="card"><h4>핵심 포인트</h4>${pts}</div>${finCard(j.financials)}${valCard(j.valuation)}${consCard(j.consensus)}${news}<div class="foot">${j.dart_url?`<a href="${esc(j.dart_url)}" target="_blank" rel="noopener">DART 원문 ↗</a> · `:''}${esc(j.sources_note||"")} 정보 제공용이며 투자 권유가 아닙니다.</div>`;
  if(user && window.innerWidth<=900) $("#detail").scrollIntoView({behavior:"smooth",block:"start"});
}
function init(){
  $("#asof").textContent = DATA.asof;
  $("#sub").textContent = `시총 기준가: ${DATA.price_date||'-'} 종가${DATA.n_small?` · 시총 변동 ${Math.round(DATA.min_mc/1e8)}억원 미만 ${DATA.n_small}건 생략`:''} · 생성 ${DATA.generated}`;
  $("#tabs").innerHTML = TABS.map(t=>`<button class="tab" data-t="${t[0]}">${t[1]}<b>${t[2]}</b></button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.t; renderTab();});
  renderTab();
}
init();
</script>
</body>
</html>
